<svg width="680" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg">
<style>
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .title { font-size: 15px; font-weight: 600; fill: #c9d1d9; }
  .label { font-size: 13px; font-weight: 600; fill: #fff; }
  .sub { font-size: 11px; fill: rgba(255,255,255,0.8); }
  .note { font-size: 11px; fill: #8b949e; font-style: italic; }
  .dim { font-size: 11px; fill: #8b949e; }
  .arr { stroke: #8b949e; stroke-width: 1.5; fill: none; }
  .arr-dash { stroke: #8b949e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
  .cbox { fill: #161b22; stroke: #30363d; stroke-width: 1; }
  .clabel { font-size: 13px; font-weight: 600; fill: #c9d1d9; }
  marker path { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9"/>
  </marker>
</defs>

<!-- Title -->
<text class="title" x="340" y="28" text-anchor="middle">MCP weather server — request cycle</text>

<!-- 1. User box -->
<rect x="250" y="46" width="180" height="40" rx="8" fill="#484f58"/>
<text class="label" x="340" y="66" text-anchor="middle" dominant-baseline="central">You (the user)</text>

<!-- Arrow: user -> claude -->
<line x1="340" y1="86" x2="340" y2="116" class="arr" marker-end="url(#ah)"/>
<text class="note" x="350" y="105">"What's the humidity?"</text>

<!-- 2. Claude box -->
<rect x="190" y="116" width="300" height="52" rx="8" fill="#1f6feb"/>
<text class="label" x="340" y="137" text-anchor="middle" dominant-baseline="central">Claude Desktop (MCP client)</text>
<text class="sub" x="340" y="155" text-anchor="middle" dominant-baseline="central">LLM decides which tool to call</text>

<!-- Arrow: claude -> server -->
<line x1="340" y1="168" x2="340" y2="210" class="arr" marker-end="url(#ah)"/>
<text class="note" x="350" y="194">JSON-RPC over stdio</text>

<!-- 3. Server container -->
<rect x="100" y="210" width="480" height="196" rx="12" class="cbox"/>
<text class="clabel" x="340" y="234" text-anchor="middle">Your MCP server (src/index.ts)</text>

<!-- Zod box -->
<rect x="128" y="252" width="180" height="40" rx="8" fill="#8957e5"/>
<text class="label" x="218" y="272" text-anchor="middle" dominant-baseline="central">Zod validates inputs</text>

<!-- Arrow: zod -> handler -->
<line x1="308" y1="272" x2="348" y2="272" class="arr" marker-end="url(#ah)"/>

<!-- Handler box -->
<rect x="348" y="252" width="204" height="40" rx="8" fill="#8957e5"/>
<text class="label" x="450" y="272" text-anchor="middle" dominant-baseline="central">Tool handler runs</text>

<!-- Arrow: handler -> makeNWSRequest -->
<line x1="450" y1="292" x2="450" y2="330" class="arr" marker-end="url(#ah)"/>

<!-- makeNWSRequest box -->
<rect x="300" y="330" width="250" height="40" rx="8" fill="#bc4c00"/>
<text class="label" x="425" y="350" text-anchor="middle" dominant-baseline="central">makeNWSRequest(url)</text>

<!-- Dashed return arrow -->
<line x1="128" y1="272" x2="128" y2="218" class="arr-dash" marker-end="url(#ah)"/>
<text class="dim" x="50" y="248">Text result</text>
<text class="dim" x="74" y="262">back</text>

<!-- Arrow: server -> NWS -->
<line x1="425" y1="406" x2="425" y2="440" class="arr" marker-end="url(#ah)"/>
<text class="note" x="435" y="428">HTTPS fetch</text>

<!-- 4. NWS API box -->
<rect x="255" y="440" width="290" height="52" rx="8" fill="#9e6a03"/>
<text class="label" x="400" y="460" text-anchor="middle" dominant-baseline="central">National Weather Service API</text>
<text class="sub" x="400" y="478" text-anchor="middle" dominant-baseline="central">api.weather.gov (free, no auth)</text>

</svg>
